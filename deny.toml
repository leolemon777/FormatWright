[graph]
all-features = true

[advisories]
# sevenz-rust: RUSTSEC-2026-0245 affects the disk-writing decompress path and
# RUSTSEC-2026-0246 flags the crate unmaintained; we only use in-memory
# entry reads/writes for repacking and pin the exact version. Replace with
# a maintained 7z implementation before any Certified claim.
ignore = [
    "RUSTSEC-2026-0245",
    "RUSTSEC-2026-0246",
]
unmaintained = "workspace"

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# Warn only: thiserror 1.x (via axum) still carries proc-macro-error with a
# "*" license field (upstream MIT); no per-crate wildcard exemption exists.
wildcards = "warn"
# thiserror 1.x (transitive via axum) still pulls proc-macro-error, whose
# license field is a wildcard "*"; upstream is MIT. Skipping also exempts it
# from the wildcard ban.
skip = [{ name = "proc-macro-error" }]
# thiserror 1.x still pulls proc-macro-error, whose license field is a
# wildcard; the crate is MIT-licensed upstream and unmaintained-in-place.
highlight = "simplest-path"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

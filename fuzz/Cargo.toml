[package]
name = "formatwright-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
formatwright-core = { path = "../crates/core" }
formatwright-engine-sdk = { path = "../crates/engine-sdk" }
libfuzzer-sys = "0.4"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }

[[bin]]
name = "engine_manifest"
path = "fuzz_targets/engine_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "structured_file"
path = "fuzz_targets/structured_file.rs"
test = false
doc = false
bench = false

[workspace]
members = [
    "crates/core",
    "crates/engine-sdk",
    "crates/cli",
    "apps/desktop/src-tauri",
    "crates/server",
]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["FormatWright contributors"]

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
csv = "1.4.0"
ed25519-dalek = "2"
fs2 = "0.4.3"
image = { version = "=0.25.9", default-features = false, features = ["jpeg", "png"] }
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
quick-xml = "0.41.0"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
flate2 = "1"
serde_json = "1"
serde_yaml_ng = "0.10.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }
zip = { version = "=6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"


[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

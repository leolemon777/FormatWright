name: Unsigned release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PNPM_VERSION: 11.16.0
  NODE_VERSION: 24

jobs:
  windows-alpha:
    name: Windows unsigned Alpha
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare pinned Windows Starter packs
        shell: pwsh
        run: scripts/prepare_windows_starter_pack.ps1
      - name: Assert the starter pack is populated
        shell: pwsh
        run: |
          $root = 'dist/engine-packs/windows-x86_64/starter'
          $bundle = Join-Path $root 'bundle.json'
          if (-not (Test-Path -LiteralPath $bundle)) {
            throw "starter pack is empty or missing $bundle - an empty-directory workaround must never ship"
          }
          $entries = @(Get-ChildItem -LiteralPath $root -Recurse -File)
          if ($entries.Count -lt 5) {
            throw "starter pack looks incomplete: only $($entries.Count) files under $root"
          }
          Write-Output "starter pack verified: $($entries.Count) files, bundle.json present"
      - name: Stage dev updater key for the unsigned rehearsal
        env:
          DEV_KEY: ${{ secrets.TAURI_DEV_UPDATER_KEY }}
          DEV_KEY_PASSWORD: ${{ secrets.TAURI_DEV_UPDATER_PASSWORD }}
        shell: pwsh
        run: |
          # Unsigned Alpha rehearsals have no release key; the dev keypair
          # (test-only, never for a published channel) lives in the
          # TAURI_DEV_UPDATER_KEY repo variable so the private half never
          # enters the repository.
          $key = $env:DEV_KEY
          if ([string]::IsNullOrWhiteSpace($key)) {
            Write-Output 'No dev key variable set; skipping updater artifact signing setup.'
            exit 0
          }
          # Tauri's minisign loader is picky about file encoding; passing the
          # key content directly as the env var value avoids the file layer.
          echo "TAURI_SIGNING_PRIVATE_KEY=$key" >> $env:GITHUB_ENV
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$env:DEV_KEY_PASSWORD" >> $env:GITHUB_ENV
      - name: Build offline NSIS candidate
        run: pnpm --filter @formatwright/desktop tauri build --bundles nsis
      - name: Generate checksums
        run: python scripts/generate_checksums.py target/release/formatwright-desktop.exe target/release/bundle/nsis/Anole_0.1.0_x64-setup.exe
      - name: Reject accidental signed-release claim
        shell: pwsh
        run: |
          $files = @(
            'target/release/formatwright-desktop.exe',
            'target/release/bundle/nsis/Anole_0.1.0_x64-setup.exe'
          )
          foreach ($file in $files) {
            $status = (Get-AuthenticodeSignature -LiteralPath $file).Status.ToString()
            if ($status -ne 'NotSigned') {
              throw "Unsigned Alpha workflow received unexpected signature state $status for $file"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: formatwright-windows-unsigned-alpha
          if-no-files-found: error
          path: |
            target/release/formatwright-desktop.exe
            target/release/bundle/nsis/Anole_0.1.0_x64-setup.exe
            dist/SHA256SUMS
          retention-days: 14
